[global]
   workgroup = WORKGROUP
   server string = Samba Server in Docker
   server role = standalone server
   security = user
   map to guest = Bad User

   # Protocol Security & Modern Standards (SMB2/SMB3)
   server min protocol = SMB2_02
   client min protocol = SMB2_02

   # Disable Print Subsystem to Avoid Log Noise
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   dns proxy = no

   # Logging
   log level = 1
   log file = /var/log/samba/%m.log
   max log size = 5000

   # Network & I/O Performance Tuning
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
   aio read size = 16384
   aio write size = 16384
   use sendfile = yes
   strict locking = no

   # macOS Apple Finder Compatibility & Time Machine VFS
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = Macmini
   fruit:veto_appledouble = no
   fruit:posix_rename = yes
   fruit:zero_file_id = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[Shared]
   comment = Shared Directory
   path = /srv/samba/shared
   browseable = yes
   writable = yes
   guest ok = yes
   read only = no
   inherit permissions = yes
   create mask = 0777
   directory mask = 0777
   force create mode = 0777
   force directory mode = 0777
